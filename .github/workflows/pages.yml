name: Deploy NABT to GitHub Pages
run-name: NABT Pages • ${{ github.sha }}
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Generate PWA icons from Nabt logo
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow cairosvg
          python3 scripts/generate_pwa_icons.py
      - name: Type-check and build production site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://cieyyciklonkmeadgnzq.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_8Ne9X-9H8H0XHQD7Og-Ylg_5A1thhO6' }}
      - name: Confirm production artifact exists
        run: |
          test -s dist/index.html
          test -d dist/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live-site:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify public GitHub Pages serves the built React assets
        shell: bash
        run: |
          set -euo pipefail
          URL="https://israamin.github.io/NABT/?verify=${GITHUB_SHA}"
          for attempt in {1..12}; do
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$URL" -o /tmp/nabt-live.html || true
            if grep -Eq 'src="/NABT/assets/[^"]+\.js"' /tmp/nabt-live.html 2>/dev/null; then
              echo "Published page references compiled Vite assets; checking current code."
              ASSET=$(grep -oE 'src="/NABT/assets/[^"]+\.js"' /tmp/nabt-live.html | head -1 | cut -d'"' -f2)
              curl -fsSL --max-time 20 "https://israamin.github.io${ASSET}" -o /tmp/nabt-live.js || true
              if grep -Fq 'رقم الهاتف يجب أن يحتوي' /tmp/nabt-live.js 2>/dev/null; then
                echo "Verified latest registration phone fix in the PUBLIC JavaScript bundle: ${ASSET}"
                exit 0
              fi
              echo "Page is online but still serving the OLD registration code. Retrying deployment propagation."
            fi
            echo "Attempt ${attempt}: published HTML has not updated to compiled assets yet"
            sleep 10
          done
          echo "::error::Live page did not publish the latest registration phone fix. Check GitHub Pages deployment."
          head -c 1200 /tmp/nabt-live.html || true
          exit 1

      - name: Verify video sharing deployed to public site
        shell: bash
        run: |
          set -euo pipefail
          URL="https://cieyyciklonkmeadgnzq.supabase.co/functions/v1/share-video?id=00000000-0000-0000-0000-000000000000"
          STATUS=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$URL")
          test "$STATUS" = "404" || { echo "::error::Public share-video endpoint returned $STATUS instead of 404 for nonexistent video"; exit 1; }
          echo "Video sharing Edge Function responds and hides missing videos."
          for attempt in {1..10}; do
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://israamin.github.io/NABT/?video-check=${GITHUB_SHA}" -o /tmp/nabt-video.html
            ASSET=$(grep -oE 'src="/NABT/assets/[^" ]+\.js"' /tmp/nabt-video.html | head -1 | cut -d'"' -f2)
            if [ -n "$ASSET" ]; then
              curl -fsSL --max-time 20 "https://israamin.github.io$ASSET" -o /tmp/nabt-video.js
              if grep -q 'مشاركة واتساب' /tmp/nabt-video.js; then
                echo "Deployed JavaScript includes WhatsApp video sharing."
                exit 0
              fi
            fi
            echo "Waiting for latest video-sharing assets (attempt $attempt)"
            sleep 10
          done
          echo '::error::Published JavaScript does not contain the video-share control.'
          exit 1

      - name: Verify WhatsApp previews redirect people to the actual lesson
        shell: bash
        run: |
          set -euo pipefail
          VIDEO_ID="3ecd89ce-50bb-476a-993c-ac7766fecc63"
          LINK="https://cieyyciklonkmeadgnzq.supabase.co/functions/v1/share-video?id=${VIDEO_ID}"
          STATUS=$(curl -sS --max-time 20 -o /dev/null -D /tmp/nabt-human-headers.txt -w '%{http_code}' -H 'User-Agent: Mozilla/5.0 (Android 15; Mobile)' "$LINK")
          test "$STATUS" = "302" || { echo "::error::Human share link returned $STATUS instead of 302"; exit 1; }
          grep -qi "location: https://israamin.github.io/NABT/#lesson/${VIDEO_ID}" /tmp/nabt-human-headers.txt
          BOT_STATUS=$(curl -sS --max-time 20 -o /tmp/nabt-share-preview.html -w '%{http_code}' -H 'User-Agent: facebookexternalhit/1.1' "$LINK")
          test "$BOT_STATUS" = "200" || { echo "::error::WhatsApp crawler returned $BOT_STATUS"; exit 1; }
          grep -q 'property="og:title"' /tmp/nabt-share-preview.html
          grep -q 'property="og:image"' /tmp/nabt-share-preview.html
          echo "Success: browser gets direct lesson redirect, social crawler gets rich preview."
