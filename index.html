<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#075a37"/>
<title>نبت</title>
<link rel="icon" href="/NABT/icons/favicon-32.png" type="image/png" sizes="32x32"/>
<link rel="icon" href="/NABT/nabt-logo.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" sizes="180x180" href="/NABT/icons/apple-touch-icon.png"/>
<link rel="manifest" href="/NABT/manifest.webmanifest"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="نبت"/>
<style>body{margin:0;background:#f8f9f6;color:#143b2a;font-family:Tahoma,Arial,sans-serif}#boot{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#f8f9f6;padding:20px;text-align:center}#boot .inner{max-width:440px}#boot h1{color:#075a37}#boot small{display:block;direction:ltr;color:#85483b;word-break:break-word;white-space:pre-wrap;margin-top:20px}#boot button{border:0;border-radius:12px;background:#075a37;color:#fff;padding:13px 22px;margin:16px;font:inherit}</style>
<script>
window.__nabtError='';
(function(){
function report(error){window.__nabtError=String(error||'Unknown error');var t=document.getElementById('boot-error');if(t)t.textContent=window.__nabtError;}
window.addEventListener('error',function(e){report(e.message||('Error loading '+(e.target&&e.target.src||'')))},true);
window.addEventListener('unhandledrejection',function(e){report(e.reason&&e.reason.message||e.reason)});
window.addEventListener('DOMContentLoaded',function(){setTimeout(function(){var b=document.getElementById('boot');if(b){var p=document.getElementById('boot-status');if(p)p.textContent='تأخر تحميل التطبيق. جربي تحديث الصفحة أو شبكة أخرى.';var t=document.getElementById('boot-error');if(t&&!t.textContent)t.textContent='لم ينتهِ بدء التطبيق في هذا المتصفح.';}},15000);});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/NABT/sw.js',{scope:'/NABT/'}).catch(function(e){console.warn('Nabt PWA unavailable',e)})})}
})();
</script>
</head>
<body>
<div id="root"></div>
<div id="boot"><div class="inner"><div style="font-size:52px">🌱</div><h1>نبت</h1><p id="boot-status">جارٍ فتح المنصة...</p><button type="button" onclick="location.reload()">إعادة التحميل</button><small id="boot-error"></small></div></div>
<script type="module" src="/src/main.tsx"></script>
</body></html>
